<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mensagem</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="chat-container">
        <h2>Enviar Mensagem</h2>
        <input type="text" placeholder="Seu nome" id="remetente">
        <input type="text" placeholder="Destinatário" id="destinatario">
        <textarea placeholder="Escrever mensagem" id="mensagem"></textarea>
        <button onclick="sendMessage()">Enviar</button>
        <div id="resposta"></div>
    </div>
</body>
</html>
